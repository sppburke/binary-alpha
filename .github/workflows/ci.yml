name: ci

on:
  push:
    branches: [main]
  pull_request:

# Wall-clock is bounded by the slowest job, so lint and four test shards run at once. Every
# test runs in exactly one shard: the three `data_pipeline` shards name their modules, and
# `everything-else` runs the other crates, the application's unit tests, and every other
# integration test with exactly those modules skipped, so a new test file or module runs
# there by default. Filters are libtest substrings: `retire::` also selects `review_retire::`.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain with rustfmt and clippy
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: pipeline-lifecycle
            run: >-
              cargo test -p binary-alpha-app --locked --test data_pipeline --
              daily_end_to_end:: new_instrument::
          - shard: pipeline-migration
            run: >-
              cargo test -p binary-alpha-app --locked --test data_pipeline --
              review_final:: migrate_census:: lineage:: daily_readers::
          - shard: pipeline-retirement
            run: >-
              cargo test -p binary-alpha-app --locked --test data_pipeline --
              retire:: review_archive:: registry_archive:: archive_records::
          - shard: everything-else
            run: |
              cargo test --workspace --locked --exclude binary-alpha-app
              cargo test -p binary-alpha-app --locked --lib --bins
              cargo test -p binary-alpha-app --locked --test '*' --
                --skip daily_end_to_end:: --skip new_instrument:: --skip review_final:: --skip migrate_census::
                --skip lineage:: --skip daily_readers:: --skip retire:: --skip review_archive::
                --skip registry_archive:: --skip archive_records::
              cargo run --locked -p binary-alpha-app -- config validate --config configs/example.toml
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain with rustfmt and clippy
        run: rustup toolchain install
      - run: ${{ matrix.run }}
