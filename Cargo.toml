[workspace]
resolver = "3"
members = ["crates/engine", "crates/app", "crates/accelerator"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
cudarc = { version = "0.19.9", default-features = false, features = ["std", "driver", "dynamic-loading", "cuda-13000", "nvrtc"] }
clap = { version = "4.6.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
google-cloud-storage = "1.18.0"
parquet = { version = "59.3.0", default-features = false, features = ["snap", "zstd"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip", "raw_value"] }
sha2 = { version = "0.11.0", default-features = false }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "sync", "time"] }
toml = "1.1.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "query"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await", "sink"] }
tokio-postgres = { version = "0.7.18" }
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["aws-lc-rs"] }
rustls = { version = "0.23.44", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
