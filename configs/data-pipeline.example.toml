# Research market-data pipeline, schema version 1. Credential values never enter this file.
# Register with data pipeline add-job --config PIPELINE --template CORE
# --broker BROKER --symbol SYMBOL [--quote-currency CURRENCY] [--session SESSION_FILE].
# Templates: data-pipeline-deriv.example.toml and data-pipeline-pocket.example.toml.
# Explicit singular instruments.session is required. First update needs no data import.
schema_version = 1
local_root = "../historical_data"
# Instruments worked on concurrently by one producer run; raise gradually (provider rate limits).
parallel_jobs = 4
# Object uploads or downloads per job, each worker with its own Drive session (default 8).
parallel_transfers = 8
# Supply an existing study declaration when applicable; use its actual authorized location.
# governance_manifest = "file:///absolute/path/to/declaration.json"

[drive]
# Replace with an app-created or explicitly granted private Google Drive folder identifier.
root_folder_id = "REPLACE_WITH_GRANTED_FOLDER_ID"
# Name of the process variable holding credential JavaScript Object Notation (JSON), never its value.
credential = "BINARY_ALPHA_DRIVE_CREDENTIAL"
chunk_bytes = 8388608
request_timeout_seconds = 300
max_attempts = 5
# Per-request transient retry budget in seconds (default 900), with capped exponential backoff.
retry_seconds = 900

# add-job appends [[jobs]] with generated jobs/ and evidence/ relative paths.
# History budgets in sibling templates: Deriv 6000 pages, Pocket 20000 pages,
# max_elapsed_seconds = 3600, overlap_seconds = 60. Pocket has 8 pages in flight.
# These bound one invocation; rerun pending work at the same cutoff for a larger gap.
# Pocket requires origin = "https://pocketoption.com"; credential_command is a program
# and argv array (see data-pipeline-pocket.example.toml), never an inline credential.
