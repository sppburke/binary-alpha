# Research market-data pipeline, schema version 1. Credential values never enter this file.
# Job core configs follow configs/example.toml with a [history] table naming one instrument, whose
# native_granularity, overlap_seconds, max_pages, and max_elapsed_seconds the pipeline reads; the
# instrument must already be imported into <local_root>/store by `data import`. Select one instrument per job, use run_mode = "research", omit [research] and foreground
# refresh, and match history to the import's broker/ordinary role. Deriv uses ticks; Pocket uses
# native five-second bars. Prepare the sibling core configs and non-secret evidence files first;
# each evidence file is JSON whose source_identity names the broker source identity the archive
# was collected under (update refuses a configured broker with a different identity).
schema_version = 1
local_root = "../historical_data"
# Instruments worked on concurrently by one producer run; raise gradually (provider rate limits).
parallel_jobs = 2
# Object uploads or downloads per job, each worker with its own Drive session (default 8).
parallel_transfers = 8
# Supply an existing study declaration when applicable; use its actual authorized location.
# governance_manifest = "file:///absolute/path/to/declaration.json"

[drive]
# Replace with an app-created or explicitly granted private Google Drive folder identifier.
root_folder_id = "REPLACE_WITH_GRANTED_FOLDER_ID"
# Name of the process variable holding credential JavaScript Object Notation (JSON), never its value.
credential = "BINARY_ALPHA_DRIVE_CREDENTIAL"
chunk_bytes = 262144
request_timeout_seconds = 30
max_attempts = 3

[[jobs]]
id = "deriv"
config = "deriv.toml"
evidence = "evidence/deriv-source-binding.json"

[[jobs]]
id = "pocket"
config = "pocket.toml"
evidence = "evidence/pocket-source-binding.json"
