# Binary Alpha configuration, schema version 1.
# Only fields implemented by the current checkout appear here; see docs/contracts.md.
# Credentials never appear in a configuration document.
schema_version = 1
run_mode = "research"

[storage]
# A relative path resolves against this file's directory: the repository-local historical_data folder.
historical_data_dir = "../historical_data"
# Google Cloud Storage is production truth in every run mode; the bucket name is illustrative and
# the client resolves Application Default Credentials outside this document.
publication_uri = "gs://example-bucket/historical"

# One configured instrument: its identity, provider mapping, currencies, price scale, native
# granularity, the enabled quality checks (a check is enabled by the presence of its table), weekly
# sessions in seconds since Monday 00:00 UTC, and the candle streams `data audit` finalizes.
[[instruments]]
broker = "pocket_option"
provider_symbol = "AEDCNY_otc"
base_currency = "AED"
quote_currency = "CNY"
price_scale = 6
native_granularity = { kind = "tick" }
gap = { max_seconds = 2, reopen_seconds = 60 }
frozen = { min_observations = 10, min_seconds = 5 }
jump = { min_basis_points = 5 }
span = { min_percent = 75 }
sessions = [{ name = "week", open_seconds = 0, close_seconds = 604800 }]
candles = [
  { duration_seconds = 5, offset_seconds = 0, min_observations = 9, hard_min_observations = 5 },
  { duration_seconds = 15, offset_seconds = 5, min_observations = 29, hard_min_observations = 15 },
]
