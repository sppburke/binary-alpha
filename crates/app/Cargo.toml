[package]
name = "binary-alpha-app"
description = "The binary-alpha executable: configuration loading, historical-data import and verification, and external adapters"
version.workspace = true
edition.workspace = true

[[bin]]
name = "binary-alpha"
path = "src/main.rs"

[features]
cuda = ["binary-alpha-accelerator/cuda"]

[dependencies]
binary-alpha-accelerator = { path = "../accelerator" }
binary-alpha-engine = { path = "../engine" }
clap.workspace = true
google-cloud-storage.workspace = true
parquet.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
toml.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
rustls.workspace = true
