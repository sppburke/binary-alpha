# The same values as configs/example.toml with different order, spacing, and comments.

run_mode   =   "research"   # trailing comment
schema_version=1

[[instruments]]
candles = [ { hard_min_observations = 5, min_observations = 9, offset_seconds = 0, duration_seconds = 5 }, { duration_seconds = 15, offset_seconds = 5, min_observations = 29, hard_min_observations = 15 } ]
sessions = [ { close_seconds = 604800, open_seconds = 0, name = "week" } ]
quote_currency = "CNY"
provider_symbol = "AEDCNY_otc"   # trailing comment
broker = "pocket_option"
base_currency = "AED"
price_scale = 6
[instruments.span]
min_percent = 75
[instruments.jump]
min_basis_points = 5
[instruments.frozen]
min_seconds = 5
min_observations = 10
[instruments.gap]
reopen_seconds = 60
max_seconds = 2
[instruments.native_granularity]
kind = "tick"

[storage]
publication_uri="gs://example-bucket/historical"   # trailing comment
historical_data_dir   =   "../historical_data"
